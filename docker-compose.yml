services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dongtian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dongtian}
      POSTGRES_DB: ${POSTGRES_DB:-dongtian}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - dongtian-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres-test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-dongtian_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-dongtian_test}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-dongtian_test}
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    volumes:
      - dongtian-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  dongtian-postgres-data:
  dongtian-postgres-test-data:
